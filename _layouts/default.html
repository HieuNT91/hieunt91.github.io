<!doctype html>
<html lang="{{ site.locale | default: 'en' | slice: 0, 2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <title>{% if page.title and page.title != '' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
  </head>
  <body{% if page.home %} class="home-page"{% else %} class="interior-page"{% endif %}>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="site-mark" aria-hidden="true">HN</span>
          <span>{{ site.title }}</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#about-me">About</a>
          {% if site.data.news and site.data.news.size > 0 %}
            <a href="{{ '/' | relative_url }}#news">News</a>
          {% endif %}
          <a href="{{ '/' | relative_url }}#publications">Publications</a>
          <a href="{{ '/' | relative_url }}#academic-services">Service</a>
          <a href="{{ '/' | relative_url }}#honors-and-awards">Honors</a>
        </nav>
      </div>
    </header>

    <main id="content" class="page-shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}.</p>
    </footer>
  </body>
</html>
